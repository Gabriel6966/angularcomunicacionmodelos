<h1>Padre deportes</h1>
<h2 style="color: cyan">{{mensaje}}</h2>

<ul>
    @for(deporte of deportes;track deporte){
        <li>
            <app-hijo-deporte-component 
            (seleccionarFavorito)="seleccionarFavorito($event)"
            [sport]="deporte"></app-hijo-deporte-component>
        </li>
    }
</ul>
